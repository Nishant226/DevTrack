version: '3.8'

services:
  backend:
    build: ./devtrack bakend
    container_name: devtrack-backend
    ports:
      - "5000:5000"
    env_file: ./devtrack bakend/.env
    environment:
      - MONGO_URI=mongodb://mongo:27017/devtrack
    volumes:
      - ./devtrack bakend:/app
      - /app/node_modules
    depends_on:
      - mongo
    restart: always

  mongo:
    image: mongo:latest
    container_name: devtrack-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: always

  frontend:
    build: .
    container_name: devtrack-frontend
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: always

volumes:
  mongo_data: