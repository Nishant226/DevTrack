name: DevTrack CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js Environment
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Integration Tests
        env:
          MONGO_URI: mongodb://localhost:27017/devtrack_test
          JWT_SECRET: github_actions_secret_test_key_12345
          GEMINI_API_KEY: dummy_gemini_key
          PORT: 5000
        run: npm test

      - name: Build Check
        run: echo "Backend CI Pipeline Passed Successfully!"